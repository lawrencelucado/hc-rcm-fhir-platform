spring:
  datasource:
    url: jdbc:postgresql://fhir-postgres:5432/hapi
    username: hapi
    password: ${SPRING_DATASOURCE_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: false

hapi:
  fhir:
    fhir_version: R4
    server_address: http://10.20.1.207:8090/fhir
    default_encoding: json
    enforce_referential_integrity_on_write: true
    enforce_referential_integrity_on_delete: true
    tester:
      - id: home
        name: RCM FHIR Homelab
        server_address: http://10.20.1.207:8090/fhir
        refuse_to_fetch_third_party_urls: true
        fhir_version: R4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
