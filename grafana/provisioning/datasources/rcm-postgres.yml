apiVersion: 1
datasources:
  - name: RCM-PostgreSQL
    type: postgres
    uid: rcm-postgres
    url: postgres:5432
    # Values come from the container environment (set in docker-compose.yml from .env)
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: false
