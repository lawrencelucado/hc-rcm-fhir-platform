services:
  postgres:
    image: postgres:16
    container_name: rcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rcm
      POSTGRES_PASSWORD: rcm_dev_2026
      POSTGRES_DB: rcm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ingest/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: rcm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: rcmadmin
      MINIO_ROOT_PASSWORD: rcm_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
