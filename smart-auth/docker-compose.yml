version: "3.8"

services:
  keycloak-db:
    image: postgres:16.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://10.20.1.157:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./realm-healthcare.json:/opt/keycloak/data/import/realm-healthcare.json:ro

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    restart: unless-stopped
    depends_on:
      - keycloak
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://10.20.1.157:8180/realms/healthcare
      - --client-id=smart-fhir-gateway
      - --client-secret=${SMART_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=false
      - --email-domain=*
      - --http-address=0.0.0.0:4180
      - --redirect-url=http://10.20.1.157:8091/oauth2/callback
      - --reverse-proxy=true
      - --skip-jwt-bearer-tokens=true
      - --bearer-token-login-fallback=false
      - --pass-access-token=true
      - --upstream=http://10.20.1.207:8090

  smart-gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      - oauth2-proxy
    ports:
      - "8091:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./smart-configuration.json:/usr/share/nginx/html/.well-known/smart-configuration:ro

volumes:
  keycloak_db:
