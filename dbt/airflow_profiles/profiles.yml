rcm_platform:
  target: docker
  outputs:
    docker:
      type: postgres
      host: "{{ env_var('DB_HOST', 'postgres') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DB_NAME', 'rcm') }}"
      user: "{{ env_var('DB_USER', 'rcm') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      schema: curated
      threads: 4
